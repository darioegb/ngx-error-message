name: Bug Report
description: Report a problem with ngx-error-message
labels: ['bug']
body:
  - type: input
    id: lib-version
    attributes:
      label: ngx-error-message version
      placeholder: e.g. 4.0.0
    validations:
      required: true
  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: e.g. 20.1.0
    validations:
      required: true
  - type: dropdown
    id: uses-ngx-translate
    attributes:
      label: Are you using @ngx-translate/core with withNgxTranslate()?
      options:
        - 'Yes'
        - 'No - static errorMessages config'
        - 'No - NgModule without withNgxTranslate()'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce, ideally a Stackblitz link or minimal repo.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
